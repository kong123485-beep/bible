福音 28:19–20",verse:"「所以，你們要去，使萬民作我的門徒……」",notes:["開頭就講家譜，證明耶穌係大衛後裔、亞伯拉罕子孫。","成日引用舊約：「要應驗先知嘅話」，證明預言應驗晒。","記載登山寶訓、天國比喻，講天國子民點樣生活。","結尾係大使命：去、施洗、教導，耶穌常同門徒同在。"]},{id:2,name:"馬可福音",short:"可",cat:"福音書",author:"馬可（彼得嘅同工，記錄彼得嘅講道）",period:"約公元 55–65 年",audience:"寫俾羅馬人 / 外邦信徒",theme:"耶穌係受苦嘅僕人，用行動同十字架顯出救恩。",people:"耶穌、彼得、雅各、約翰",verseRef:"馬可福音 10:45",verse:"「人子來，並不是要受人的服事，乃是要服事人。」",notes:["最短、最快手嘅福音書，成日話「立刻、隨即」。","少講長篇道理，多講神蹟：醫病、趕鬼、平靜風浪。","重點係跟隨耶穌要背十字架，唔係追風光。","結尾強調復活：墳墓空咗，耶穌真係復活。"]},{id:3,name:"路加福音",short:"路",cat:"福音書",author:"路加（醫生，保羅嘅同工）",period:"約公元 60–62 年",audience:"寫俾提阿非羅，同所有外邦讀者",theme:"耶穌係普世嘅救主，嚟搵失喪嘅人，憐憫卑微者。",people:"耶穌、馬利亞、撒該、好撒馬利亞人、浪子",verseRef:"路加福音 19:10",verse:"「人子來，為要尋找、拯救失喪的人。」",notes:["考據最仔細，訪問好多見證人，次序寫得好清楚。","特別多講禱告、聖靈、婦女、窮人同被排斥嘅人。","獨有嘅比喻：好撒馬利亞人、浪子、法利賽人同稅吏。","耶穌降生故事最完整：馬利亞、牧羊人、 Simeon 嘅讚美。"]},{id:4,name:"約翰福音",short:"約",cat:"福音書",author:"使徒約翰（耶穌所愛嘅門徒）",period:"約公元 85–95 年",audience:"寫俾所有信徒，要人信耶穌係神嘅兒子",theme:"耶穌就係道成肉身嘅神，信佢就得永生。",people:"耶穌、尼哥底母、撒馬利亞婦人、拉撒路",verseRef:"約翰福音 3:16",verse:"「神愛世人，甚至將他的獨生子賜給他們。」",notes:["唔係按時間順序寫，而係用七個神蹟 + 七個「我是」嚟證明身份。","「我是生命的糧、好牧人、道路真理生命」——全部指向耶穌。","好多長篇對話：同尼哥底母講重生，同婦人講活水。","開頭好震撼：「太初有道，道與神同在，道就是神。」"]},{id:5,name:"使徒行傳",short:"徒",cat:"歷史書",author:"路加",period:"約公元 62–63 年",audience:"寫俾提阿非羅，記錄教會點樣由耶路撒冷擴展到地極",theme:"聖靈降臨，福音由耶路撒冷一路傳到羅馬，教會就係咁誕生。",people:"彼得、保羅、司提反、巴拿巴、腓利",verseRef:"使徒行傳 1:8",verse:"「聖靈降臨在你們身上，你們就必得著能力……直到地極。」",notes:["新約唯一歷史書，係路加福音嘅下集。","五旬節：聖靈降臨，三千人信主，教會正式成立。","前半彼得做主角，後半保羅做主角，福音衝破猶太界限。","教會受逼迫反而令福音傳得更遠，係全書關鍵轉捩點。"]},{id:6,name:"羅馬書",short:"羅",cat:"保羅書信",author:"保羅",period:"約公元 57 年（哥林多）",audience:"寫俾羅馬教會，佢未去過嗰度",theme:"人人都有罪，惟有因信耶穌稱義，呢個就係福音嘅大能。",people:"保羅、亞伯拉罕、亞當、基督",verseRef:"羅馬書 1:16–17",verse:"「這福音本是神的大能，要救一切相信的。」",notes:["保羅神學最完整、最系統嘅一封信，唔好跳住嚟睇。","1–11章講道理：罪、稱義、成聖、神嘅揀選；12–16章講生活。","「因信稱義」係核心：唔係靠做好事，而係靠信耶穌。","講到基督徒要將身體獻上，當作活祭，唔好效法呢個世界。"]},{id:7,name:"哥林多前書",short:"林前",cat:"保羅書信",author:"保羅",period:"約公元 55 年（以弗所）",audience:"寫俾哥林多教會，嗰度問題多到數唔晒",theme:"教會要聖潔、合一，用愛心行使恩賜，唔好俾世界同化。",people:"保羅、亞波羅、磯法、哥林多信徒",verseRef:"哥林多前書 13:13",verse:"「如今常存的有信，有望，有愛；其中最大的是愛。」",notes:["處理分黨、淫亂、訴訟、婚姻、拜偶像等實際問題。","講愛嘅篇章（13章）係全書高峰：恩賜冇愛就等於零。","講復活（15章）：若基督冇復活，我哋所信嘅就枉然。","屬靈恩賜係為咗建立教會，唔係用嚟炫耀自己。"]},{id:8,name:"哥林多後書",short:"林後",cat:"保羅書信",author:"保羅",period:"約公元 55–56 年（馬其頓）",audience:"寫俾哥林多教會，為自己使徒身份辯護",theme:"真使徒唔係靠威風，而係喺軟弱、受苦中顯出基督嘅能力。",people:"保羅、提多、哥林多信徒",verseRef:"哥林多後書 12:9",verse:"「我的恩典夠你用的，因為我的能力是在人的軟弱上顯得完全。」",notes:["保羅最坦白、最掏心嘅一封信，講自己受苦同眼淚。","「我身上有根刺」：神冇拎走佢，反而話恩典夠用。","講奉獻：唔係勉強，而係甘心樂意，神喜愛樂意施捨嘅人。","真服事唔係比較邊個勁，而係將人帶到基督面前。"]},{id:9,name:"加拉太書",short:"加",cat:"保羅書信",author:"保羅",period:"約公元 48–49 年",audience:"寫俾加拉太眾教會，佢哋俾假教師搞亂咗",theme:"得救只靠恩典、只靠信心，加返律法就係離開福音。",people:"保羅、彼得、亞伯拉罕、假教師",verseRef:"加拉太書 2:16",verse:"「人稱義不是因行律法，乃是因信耶穌基督。」",notes:["保羅最嬲嘅一封信，一開頭就話：若有人傳別嘅福音，佢就該受咒詛。","用亞伯拉罕做例子：佢係因信稱義，唔係因守律法。","聖靈嘅果子 vs 情慾嘅事：真自由唔係放縱，而係結出仁愛喜樂。","「我已經與基督同釘十字架」——舊我死咗，而家活嘅係基督。"]},{id:10,name:"以弗所書",short:"弗",cat:"保羅書信",author:"保羅（監獄書信）",period:"約公元 60–62 年（羅馬監獄）",audience:"寫俾以弗所教會，同附近眾教會",theme:"教會係基督嘅身體，喺基督裡合而為一，活出新生命。",people:"保羅、以弗所信徒、基督",verseRef:"以弗所書 2:8",verse:"「你們得救是本乎恩，也因著信。」",notes:["前半講身份：我哋喺基督裡有幾富足；後半講生活：點樣行得配。","講教會合一：猶太人同外邦人喺基督裡拆咗中間隔斷嘅牆。","講屬靈軍裝：唔係同血肉爭戰，而係要企穩，抵擋仇敵。","婚姻、家庭、工作，全部都要喺主裡面重新對齊。"]},{id:11,name:"腓立比書",short:"腓",cat:"保羅書信",author:"保羅（監獄書信）",period:"約公元 60–62 年",audience:"寫俾腓立比教會，保羅最錫嘅教會",theme:"喺監獄都可以喜樂，因為活著就係基督，死咗都有益處。",people:"保羅、提摩太、以巴弗提、友阿爹同循都基",verseRef:"腓立比書 4:13",verse:"「我靠著那加給我力量的，凡事都能做。」",notes:["全書成日講「喜樂、歡喜」，係喜樂嘅書信。","基督虛己嘅詩歌（2:5–11）：耶穌放低自己，降卑到死喺十字架。","保羅視萬事如糞土，為要得著基督，忘記背後，努力面前。","講知足：無論咩環境都學識知足，因為主加力量。"]},{id:12,name:"歌羅西書",short:"歌",cat:"保羅書信",author:"保羅（監獄書信）",period:"約公元 60–62 年",audience:"寫俾歌羅西教會，嗰度有異端混入",theme:"基督係萬有嘅主，豐盛都在佢裡面，唔使再加啲乜。",people:"保羅、以巴弗、阿尼西母、歌羅西信徒",verseRef:"歌羅西書 1:18",verse:"「他也是教會全體之首，他是元始。」",notes:["針對異端：有人話要加天使、規條、神秘經驗先夠屬靈。","保羅回應：基督已經夠晒，佢就係神本體一切豐盛所在。","「你們要思念上面嘅事，唔好思念地上嘅事」——身份決定生活。","講舊人脫去、新人穿上，喺家庭同工作活出基督。"]},{id:13,name:"帖撒羅尼迦前書",short:"帖前",cat:"保羅書信",author:"保羅",period:"約公元 50–51 年（最早期保羅書信之一）",audience:"寫俾帖撒羅尼迦年輕教會",theme:"喺逼迫中仍然站穩，等候主再來，生活要聖潔。",people:"保羅、西拉、提摩太、帖撒羅尼迦信徒",verseRef:"帖撒羅尼迦前書 5:17",verse:"「不住地禱告。」",notes:["保羅好掛住佢哋，讚佢哋信心、愛心、盼望都好堅固。","講聖潔生活：遠避淫行，唔好俾慾望控制自己。","講主再來同信徒復活：睡咗嘅信徒唔會蝕底，主嚟會一齊被提。","結尾三寶：常常喜樂、不住禱告、凡事謝恩。"]},{id:14,name:"帖撒羅尼迦後書",short:"帖後",cat:"保羅書信",author:"保羅",period:"約公元 51–52 年",audience:"寫俾帖撒羅尼迦教會，澄清主再來嘅誤解",theme:"主再來之前有啲事要發生，唔好慌，唔好停工，要繼續忠心。",people:"保羅、帖撒羅尼迦信徒",verseRef:"帖撒羅尼迦後書 3:13",verse:"「你們行善，不可喪志。」",notes:["有人話「主嘅日子已經嚟咗」，搞到教會人心惶惶。","保羅澄清：大罪人未顯露、離道反教未發生，主未嚟。","有人因為等主再來就唔做嘢，保羅話：唔做工，就唔好食。","喺逼迫中堅持，神必報應，呢個就係公義。"]},{id:15,name:"提摩太前書",short:"提前",cat:"保羅書信",author:"保羅",period:"約公元 62–64 年",audience:"寫俾提摩太，佢喺以弗所牧養教會",theme:"教會要按真理行事，領袖要忠心，敬虔生活最緊要。",people:"保羅、提摩太、假教師",verseRef:"提摩太前書 3:15",verse:"「教會是永生神的家，真理的柱石和根基。」",notes:["教牧書信第一封，係「點樣牧養教會」嘅實用手冊。","講領袖資格：監督、執事要品格過關，唔好淨係睇能力。","警告假教師：佢哋講律法、家譜，搞到人離開真道。","「操練身體益處還少，惟獨敬虔凡事都有益處。」"]},{id:16,name:"提摩太後書",short:"提後",cat:"保羅書信",author:"保羅（最後一封書信）",period:"約公元 66–67 年（羅馬監獄，臨死前）",audience:"寫俾提摩太，係保羅嘅遺言",theme:"福音要傳承落去，就算受苦都要堅持，聖經夠用。",people:"保羅、提摩太、路加、馬可",verseRef:"提摩太後書 3:16",verse:"「聖經都是神所默示的，於教訓、督責……都有益處。」",notes:["保羅知道自己快要殉道：「我離世嘅時候到咗。」","「那美好的仗我已經打過了」——係堅持到底嘅告白。","叫提摩太唔好以福音為恥，要將恩賜如火挑旺。","末世人會愛自己、愛錢財，惟有聖經可以叫人得救有智慧。"]},{id:17,name:"提多書",short:"多",cat:"保羅書信",author:"保羅",period:"約公元 62–64 年",audience:"寫俾提多，佢喺克里特島牧養教會",theme:"喺混亂嘅地方建立健康教會，好行為要同真道配合。",people:"保羅、提多、克里特信徒",verseRef:"提多書 2:11",verse:"「神救眾人的恩典已經顯明出來了。」",notes:["克里特人當時名聲唔好，保羅都要喺嗰度建立教會。","講點樣按立長老，處理唔服管教、講虛空話嘅人。","針對唔同年齡、性別嘅信徒，講點樣活出敬虔生活。","恩典唔係俾我哋放縱，而係教我哋除去不敬虔嘅心。"]},{id:18,name:"腓利門書",short:"門",cat:"保羅書信",author:"保羅（監獄書信）",period:"約公元 60–62 年",audience:"寫俾腓利門，關於佢嘅逃奴阿尼西母",theme:"福音改變關係：奴隸都可以變成弟兄，愛心大過規矩。",people:"保羅、腓利門、阿尼西母、阿尼西母嘅主人",verseRef:"腓利門書 1:16",verse:"「不再是奴僕，乃是高過奴僕，是親愛的兄弟。」",notes:["全書最短嘅保羅書信，得一章，係一封私人信。","阿尼西母逃走後信主，保羅送佢返去主人嗰度。","保羅冇用命令，而係用愛心請求腓利門接納佢。","福音唔係淨係救靈魂，仲會改變人同人之間嘅關係。"]},{id:19,name:"希伯來書",short:"來",cat:"普通書信",author:"作者未有定論（傳統認為同保羅圈子有關）",period:"約公元 60–70 年",audience:"寫俾想打退堂鼓、想返去猶太教嘅信徒",theme:"耶穌比乜都大：比天使、摩西、祭司、獻祭都更超越。",people:"耶穌、摩西、亞伯拉罕、麥基洗德",verseRef:"希伯來書 11:1",verse:"「信就是所望之事的實底，是未見之事的確據。」",notes:["全書不斷比較：耶穌更美、更超越，唔好走回頭路。","講耶穌係永遠嘅大祭司，按麥基洗德等次，一次獻上就夠。","11章係信心偉人榜：亞伯、挪亞、亞伯拉罕、摩西……","結尾鼓勵：放低重擔，存心忍耐，奔跑前面嘅路。"]},{id:20,name:"雅各書",short:"雅",cat:"普通書信",author:"雅各（主耶穌嘅弟弟，耶路撒冷教會領袖）",period:"約公元 45–48 年（最早嘅新約書卷之一）",audience:"寫俾散居各地嘅十二支派信徒",theme:"真信心一定有行為，冇行為嘅信心係死嘅。",people:"雅各、亞伯拉罕、喇合、約伯",verseRef:"雅各書 2:17",verse:"「信心若沒有行為就是死的。」",notes:["風格好似箴言，短句多、好實際，專講點樣做人。","試煉唔係懲罰，而係煉出忍耐同成熟嘅信心。","舌頭好細，但力量好大；要勒住舌頭，講造就人嘅話。","真虔誠：看顧孤兒寡婦，保守自己唔沾染世俗。"]},{id:21,name:"彼得前書",short:"彼前",cat:"普通書信",author:"使徒彼得",period:"約公元 62–64 年",audience:"寫俾散居小亞細亞、受逼迫嘅信徒",theme:"受苦唔係白受，係煉淨信心，等候將來嘅榮耀。",people:"彼得、受逼迫嘅信徒",verseRef:"彼得前書 5:7",verse:"「你們要將一切的憂慮卸給神，因為他顧念你們。」",notes:["用「客旅、寄居者」形容信徒：呢個世界唔係我哋永久嘅家。","受苦時唔好以惡報惡，要以祝福回應，因為基督都係咁。","講妻子、丈夫、主人僕人，喺唔容易嘅關係中見證主。","信徒係君尊嘅祭司、聖潔嘅國度，要喺黑暗中發光。"]},{id:22,name:"彼得後書",short:"彼後",cat:"普通書信",author:"使徒彼得",period:"約公元 66–68 年（彼得殉道前）",audience:"寫俾同樣嘅信徒，警告假教師",theme:"要喺真道上長進，防備假教師，等候主再來。",people:"彼得、假教師",verseRef:"彼得後書 3:9",verse:"「主所應許的尚未成就，有人以為他是耽延……」",notes:["彼得知道自己快要離世，所以寫低最後嘅提醒。","假教師表面好屬靈，實際貪心、放縱，會帶人行差踏錯。","講主再來唔係遲到，而係寬容，等更多人悔改。","結尾提醒：要喺恩典同知識上長進，唔好俾人搖動。"]},{id:23,name:"約翰一書",short:"約一",cat:"普通書信",author:"使徒約翰",period:"約公元 85–95 年",audience:"寫俾眾教會，對抗否認耶穌道成肉身嘅異端",theme:"神就係光、就係愛；真信徒行喺光中，彼此相愛。",people:"約翰、敵基督、信徒",verseRef:"約翰一書 4:8",verse:"「沒有愛心的，就不認識神，因為神就是愛。」",notes:["冇開頭問安，一開口就講「論到從起初原有嘅生命之道」。","三個測驗：認唔認耶穌、守唔守誡命、愛唔愛弟兄。","神就係愛：唔係我哋先愛神，而係神先愛我哋。","寫呢封信係要信徒知道自己有永生，心裡有確據。"]},{id:24,name:"約翰二書",short:"約二",cat:"普通書信",author:"使徒約翰（自稱長老）",period:"約公元 85–95 年",audience:"寫俾一位姊妹同佢嘅兒女（可能指一間教會）",theme:"真理同愛心要一齊行，唔好接待傳錯誤道理嘅人。",people:"約翰、蒙揀選嘅夫人",verseRef:"約翰二書 1:6",verse:"「我們若照他的命令行，這就是愛。」",notes:["新約最短嘅書卷之一，得十三節。","愛心唔係盲目包容，仲要守住真理，唔好俾異端混入。","有人唔認耶穌係成了肉身嚟，約翰話嗰啲就係迷惑人嘅。","接待假教師就等於喺佢嘅惡行上有份，要小心。"]},{id:25,name:"約翰三書",short:"約三",cat:"普通書信",author:"使徒約翰（自稱長老）",period:"約公元 85–95 年",audience:"寫俾該猶，一位忠心接待客旅嘅信徒",theme:"要接待忠心嘅工人，唔好學丟特腓嗰種爭權、拒人嘅心。",people:"約翰、該猶、丟特腓、低米丟",verseRef:"約翰三書 1:11",verse:"「親愛的兄弟啊，不要效法惡，只要效法善。」",notes:["得十五節，係新約最短嘅書卷，係一封私人信。","讚該猶：佢接待遠方傳道人，就係同真理同工。","丟特腓做反面教材：中意做頭，唔接待人，仲趕走人。","低米丟係正面例子：眾人同真理都為佢作見證。"]},{id:26,name:"猶大書",short:"猶",cat:"普通書信",author:"猶大（主耶穌嘅弟弟，雅各嘅兄弟）",period:"約公元 65–80 年",audience:"寫俾蒙召、蒙愛、蒙保守嘅信徒",theme:"要為一次交付嘅真道竭力爭辯，防備混入教會嘅假教師。",people:"猶大、假教師、米迦勒",verseRef:"猶大書 1:3",verse:"「要為從前一次交付聖徒的真道竭力地爭辯。」",notes:["得一章，係新約最有「戰鬥味」嘅短書。","用舊約例子：出埃及、以色列人、所多瑪，提醒神會審判。","假教師嘅特徵：放縱、毀謗、不服權柄、為利混入。","結尾係好靚嘅祝福：神能保守你哋唔失腳，歡歡喜喜企喺佢面前。"]},{id:27,name:"啟示錄",short:"啟",cat:"啟示文學",author:"使徒約翰",period:"約公元 95 年（拔摩島流放期間）",audience:"寫俾小亞細亞七間教會，同歷代受逼迫嘅信徒",theme:"耶穌已經得勝，佢必再來，神要擦去一切眼淚，更新萬有。",people:"約翰、羔羊耶穌、七間教會",verseRef:"啟示錄 21:4",verse:"「神要擦去他們一切的眼淚，不再有死亡。」",notes:["唔係恐怖片，而係安慰書：受苦嘅教會要知結局係基督得勝。","用象徵寫成：七印、七號、七碗，唔好逐個字硬解。","七間教會嘅信：每間都有稱讚、責備、勸勉同應許。","結尾係新天新地：冇眼淚、冇死亡，羔羊係嗰度嘅光。"]}],Bm=["全部","福音書","歷史書","保羅書信","普通書信","啟示文學"],$m=[{t:"約公元前 4 年",title:"耶穌降生",desc:"喺伯利恆出世，道成肉身，神親自嚟到人間。"},{t:"約公元 26–30 年",title:"傳道 3 年",desc:"受洗、受試探、揀選門徒、講天國、行神蹟。"},{t:"約公元 30 年",title:"受死、復活、升天",desc:"十字架上成就救贖，第三日復活，四十日後升天。"},{t:"約公元 30 年",title:"五旬節 · 教會誕生",desc:"聖靈降臨，彼得講道，三千人信主，教會正式成立。"},{t:"約公元 47–57 年",title:"保羅宣教旅程",desc:"三次旅程，將福音帶去小亞細亞、希臘、羅馬。"},{t:"約公元 64–95 年",title:"教會受逼迫",desc:"尼祿逼迫、耶路撒冷被毀，信徒喺苦難中堅持。"},{t:"約公元 95 年",title:"啟示錄 · 盼望",desc:"約翰喺拔摩島見異象：基督必再來，新天新地要嚟到。"}],Hm=[{name:"馬太福音",author:"馬太",audience:"猶太人",image:"君王",feature:"最多引用舊約，強調預言應驗、天國",start:"家譜：由亞伯拉罕開始，證明王族血統"},{name:"馬可福音",author:"馬可",audience:"羅馬人",image:"僕人",feature:"最短最快，強調行動、神蹟、受苦",start:"施洗約翰出場，耶穌直接開始傳道"},{name:"路加福音",author:"路加",audience:"外邦人",image:"人子",feature:"最仔細、最有人情味，關心弱勢群體",start:"序言 + 施洗約翰同耶穌降生故事"},{name:"約翰福音",author:"約翰",audience:"所有信徒",image:"神子",feature:"最重神學，七個神蹟 + 七個「我是」",start:"「太初有道」——由永恆開始講起"}],Qm=[{no:"01",title:"耶穌基督係誰",desc:"佢唔只係好人、偉大教師。福音書話佢係神嘅兒子、彌賽亞、救主。認清佢係誰，就決定咗你點樣回應佢。",key:"關鍵經文：約翰福音 20:31"},{no:"02",title:"十字架與復活",desc:"十字架唔係失敗，而係神嘅救贖計劃。耶穌代罪受死、復活勝過死亡，信徒嘅罪得赦、生命得更新。",key:"關鍵經文：哥林多前書 15:3–4"},{no:"03",title:"因信稱義",desc:"人唔係靠守律法、做好事賺返救恩，而係因信耶穌白白稱義。信心係根，行為係果，兩者唔可以調轉。",key:"關鍵經文：羅馬書 3:28"},{no:"04",title:"聖靈與教會",desc:"五旬節之後，聖靈內住喺信徒裡面，賜能力、結果子。教會唔係建築物，而係基督嘅身體
