9:2",verse:"你們要聖潔，因為我耶和華你們的神是聖潔的。",points:["五祭（燔祭、素祭、平安祭、贖罪祭、贖愆祭）全部指向代贖同親近神。","贖罪日：大祭司一年一次入至聖所，預表一次過、永遠有效嘅贖罪。","聖潔唔只係敬拜嗰陣，而係食嘢、做人、做生意都要分別出嚟。","唔好跳過呢卷：唔明利未記，好難明點解耶穌要上十字架。"]},{name:"民數記",short:"民",cat:"摩西五經",author:"摩西",period:"曠野漂流約38年",theme:"行咗40年曠野，舊一代倒斃，新一代學識信靠同順服。",people:"摩西、亞倫、米利暗、迦勒、約書亞",verseRef:"民數記 14:18",verse:"耶和華不輕易發怒，並有豐盛的慈愛。",points:["名字叫「數點」：兩次數點百姓，由出埃及嗰代數到進迦南嗰代。","十二探子：十個睇環境、兩個睇神，結果差天共地。","拜金牛犢之後仲有可拉黨叛變：唔服神嘅權柄，就會喺曠野兜圈。","銅蛇舉起得醫治，係新約講信耶穌得永生嘅圖畫。"]},{name:"申命記",short:"申",cat:"摩西五經",author:"摩西",period:"進迦南之前，摩押平原",theme:"臨別贈言：記得神嘅恩，揀生命，唔好重蹈覆轍。",people:"摩西、約書亞",verseRef:"申命記 6:5",verse:"你要盡心、盡性、盡力愛耶和華你的神。",points:["「申命記」= 第二次講律法：唔係新律法，而係為新一代再講一次。","「聽啊，以色列」：愛神唔係口號，要刻喺心、教下一代、帶入生活。","祝福同咒詛並列：順服有福、離棄有禍，歷史書就係呢個原則嘅驗證。","摩西望到應許地但入唔到，領導交棒俾約書亞，神嘅工作唔會因一個人停低。"]},{name:"約書亞記",short:"書",cat:"歷史書",author:"傳統認為約書亞 / 同時代人記錄",period:"約公元前1400—1370年",theme:"神信實兌現應許：佢講得出，就帶百姓入到去。",people:"約書亞、喇合、迦勒、亞干",verseRef:"約書亞記 1:9",verse:"你當剛強壯膽！不要懼怕，也不要驚惶。",points:["過約旦河、耶利哥倒塌：仗唔係靠人數，而係靠順服同信靠。","喇合得救：外邦人因信都可以入神嘅家，仲成為耶穌家譜一員。","亞干貪心連累全營：罪從來唔係「我一個人嘅事」。","分地之後約書亞最後挑戰：「至於我和我家，我們必定事奉耶和華。」"]},{name:"士師記",short:"士",cat:"歷史書",author:"傳統認為撒母耳整理",period:"約公元前1370—1050年",theme:"冇王、各自為政，一代唔識耶和華，就一代墮落。",people:"底波拉、基甸、參孫、耶弗他、俄陀聶",verseRef:"士師記 21:25",verse:"那時，以色列中沒有王，各人任意而行。",points:["成卷書係一個循環：犯罪 → 受壓 → 呼求 → 士師拯救 → 安定 → 再犯罪。","士師唔係「完美英雄」，基甸驚、耶弗他亂許願、參孫縱慾，但神仍用佢哋。","底波拉 + 雅億：神可以用意想不到嘅人做大事。","呢卷書解釋點解以色列需要一位真正嘅君王。"]},{name:"路得記",short:"得",cat:"歷史書",author:"傳統認為撒母耳",period:"士師時代，約公元前1100年",theme:"喺最黑暗嘅時代，仍然有忠心、慈愛同救贖。",people:"拿俄米、路得、波阿斯",verseRef:"路得記 1:16",verse:"你往哪裡去，我也往那裡去。",points:["摩押女子路得揀咗拿俄米同拿俄米嘅神，忠心超越血緣同國籍。","波阿斯係「至近嘅親屬 / 救贖者」，肯付出代價贖回土地同家庭。","救贖唔係抽象概念：有人肯埋單、肯承擔，先叫救贖。","路得係大衛嘅曾祖母，外邦人入咗彌賽亞家譜，恩典一早已經好闊。"]},{name:"撒母耳記上",short:"撒上",cat:"歷史書",author:"撒母耳、拿單、迦得等人記錄整理",period:"約公元前1100—1010年",theme:"由士師到君王：人要一個王，神就俾佢哋睇清楚人心。",people:"撒母耳、掃羅、大衛、約拿單、哈拿",verseRef:"撒母耳記上 16:7",verse:"耶和華看人不像人看人，人是看外貌，耶和華是看內心。",points:["哈拿嘅禱告：冇仔、被人笑，但佢將孩子獻返俾神，變成先知撒母耳。","掃羅由被揀選到被廢：外表高大、內心驚人，唔肯認錯係致命傷。","大衛唔係一開始就完美，但佢肯悔改，神話佢係「合神心意嘅人」。","大衛與歌利亞：焦點唔係細個打大個，而係「萬軍之耶和華」先係主角。"]},{name:"撒母耳記下",short:"撒下",cat:"歷史書",author:"拿單、迦得等人整理",period:"約公元前1010—970年，大衛作王時期",theme:"大衛王朝嘅高與低：得勝、犯罪、悔改、承擔後果。",people:"大衛、拔示巴、拿單、押沙龍、約押",verseRef:"撒母耳記下 7:16",verse:"你的家和你的國必在我面前永遠堅立。",points:["大衛之約：神應許大衛嘅後裔要永遠作王，直指彌賽亞。","大衛與拔示巴：連合神心意嘅人都會跌得好甘，罪一定要處理，唔好拖。","拿單用比喻指出罪：真正嘅悔改會話「我得罪耶和華了」。","詩篇 51篇就係呢段經歷寫出嚟嘅禱告，溫書要一齊讀。"]},{name:"列王紀上",short:"王上",cat:"歷史書",author:"傳統認為耶利米整理先知記錄",period:"約公元前970—850年",theme:"所羅門嘅榮耀到王國分裂：智慧若離開順服，都會變質。",people:"所羅門、耶羅波安、羅波安、以利亞、亞哈、耶洗別",verseRef:"列王紀上 3:9",verse:"求你賜我智慧，可以判斷你的民。",points:["聖殿建成：神嘅同在係以色列榮耀嘅中心，唔係建築本身。","所羅門由求智慧到拜偶像：起點好唔代表終點好，要睇埋尾。","王國分裂唔係偶然，係羅波安驕傲 + 耶羅波安另立敬拜嘅結果。","以利亞對巴力先知：邊個係真神，要用火同生命嚟證明。"]},{name:"列王紀下",short:"王下",cat:"歷史書",author:"傳統認為耶利米整理",period:"約公元前850—560年",theme:"南北兩國一路滑落，最後先後亡國被擄。",people:"以利沙、耶戶、希西家、約西亞、瑪拿西",verseRef:"列王紀下 17:18",verse:"耶和華向以色列大發烈怒。",points:["以利沙接續以利亞：神嘅工作唔會因為一個人離開就停。","北國以色列先亡（公元前722年），南國猶大後亡（公元前586年）。","希西家同約西亞改革：就算大勢已去，個人仍然可以揀回轉。","結局好沉重，但係要記住：被擄唔係神輸咗，而係神早已講明嘅審判。"]},{name:"歷代志上",short:"代上",cat:"歷史書",author:"傳統認為以斯拉",period:"被擄歸回之後，約公元前450—400年",theme:"由亞當到大衛：幫歸回嘅百姓搵返身份同應許。",people:"亞當、大衛、所羅門、利未人",verseRef:"歷代志上 16:34",verse:"應當稱謝耶和華，因他本為善，他的慈愛永遠長存！",points:["開頭九章家譜唔好跳：歸回嘅人要證明「我哋係邊個，神點樣帶我哋嚟到今日」。","重點放大大衛：唔係講佢犯罪嗰啲，而係講佢預備聖殿、組織敬拜。","呢卷書寫俾「返嚟之後」嘅人：過去點衰都好，神嘅應許未完。","同撒母耳記對讀，就會睇到角度唔同：一個講歷史經過，一個講敬拜同應許。"]},{name:"歷代志下",short:"代下",cat:"歷史書",author:"傳統認為以斯拉",period:"歸回之後，約公元前450—400年",theme:"由所羅門到被擄：王嘅成敗，取決於佢有冇尋求耶和華。",people:"所羅門、約沙法、希西家、約西亞、烏西雅",verseRef:"歷代志下 7:14",verse:"這稱為我名下的子民，若是自卑、禱告，尋求我的面，轉離他們的惡行，我必從天上垂聽。",points:["幾乎每一個王都有一句評語：「尋求 / 離棄耶和華」，呢個就係評分標準。","烏西雅強大就驕傲：成功本身都係一個試探。","希西家、約西亞復興敬拜：改革唔係搞活動，而係返去神嘅話。","結局留咗一道門：波斯王古列下詔准百姓歸回，審判之後仍有恩典。"]},{name:"以斯拉記",short:"拉",cat:"歷史書",author:"以斯拉",period:"約公元前538—458年",theme:"歸回、重建聖殿、重新以神嘅話立國。",people:"所羅巴伯、以斯拉、古列王、亞達薛西王",verseRef:"以斯拉記 7:10",verse:"以斯拉定志考究遵行耶和華的律法，又將律例典章教訓以色列人。",points:["歸回分兩批：第一批重建聖殿，第二批以斯拉帶人重建「人心」。","聖殿工程停咗十幾年：哈該、撒迦利亞先知要出嚟鼓勵佢哋再開工。","以斯拉嘅榜樣：考究 → 遵行 → 教訓，次序唔好調轉。","同外邦通婚問題：唔係種族問題，而係信仰會被拉走，影響成個群體。"]},{name:"尼希米記",short:"尼",cat:"歷史書",author:"尼希米",period:"約公元前445—430年",theme:"52日重建城牆 + 重建百姓嘅心：禱告、領導、唔好俾人分心。",people:"尼希米、亞達薛西王、參巴拉、多比雅",verseRef:"尼希米記 6:16",verse:"這工作完成是出乎我們的神。",points:["尼希米一聽到耶路撒冷城牆倒塌就喊、禁食、禱告，唔係即刻開會。","反對聲音好多：嘲笑、恐嚇、分化，佢嘅回應係「一手做工，一手拿兵器」。","城牆起好唔等於完：要讀律法、認罪、立約，先至叫真正重建。","尼希米係好好嘅領導榜樣：禱告先行、分工清楚、唔俾情緒牽住走。"]},{name:"以斯帖記",short:"斯",cat:"歷史書",author:"未有定論，傳統認為末底改 / 以斯拉時代人",period:"波斯王亞哈隨魯時期，約公元前483—473年",theme:"全卷冇直接提神個名，但處處都係神暗中掌權。",people:"以斯帖、末底改、哈曼、亞哈隨魯王",verseRef:"以斯帖記 4:14",verse:"焉知你得了王后的位分不是為現今的機會嗎？",points:["「巧合」多到唔似巧合：王失眠、末底改啱啱救過王、哈曼啱啱起咗木架。","以斯帖要冒死見王：「我若死就死吧」，勇氣唔係冇驚，而係驚都去。","哈曼想滅猶太人，最後自己掛上自己預備嘅木架，惡有惡報。","普珥節就係記念呢件事：神冇出聲，都唔等於神冇做嘢。"]},{name:"約伯記",short:"伯",cat:"詩歌智慧書",author:"未有定論，可能是摩西時代流傳嘅古老故事",period:"背景可能好早期，成書時間有爭議",theme:"一個義人點解會受苦？苦難唔一定等於犯罪。",people:"約伯、三個朋友、以利戶、撒但",verseRef:"約伯記 19:25",verse:"我知道我的救贖者活著，末後必站立在地上。",points:["三個朋友嘅邏輯好吸引：「你受苦，一定係你有問題」，但神話佢哋講錯咗。","約伯唔係冇掙扎，佢嬲、佢問、佢喊，但佢冇離開神。","神冇直接答「點解」，而係問約伯：「你知唔知世界點運作？」——信靠大過解釋。","結局唔係「苦難有價錢」，而係約伯親眼見到神，嗰種認識先係最寶貴。"]},{name:"詩篇",short:"詩",cat:"詩歌智慧書",author:"大衛為主，另有亞薩、可拉後裔、所羅門、摩西等",period:"橫跨摩西到被擄歸回，約1000年",theme:"150篇禱告同詩歌：開心、喊、嬲、驚，全部都可以帶到神面前。",people:"大衛、亞薩、可拉後裔",verseRef:"詩篇 23:1",verse:"耶和華是我的牧者，我必不致缺乏。",points:["詩篇分五卷，係以色列人嘅「詩歌本 + 禱告本」。","唔好只背第23篇：第1、19、42、51、90、103、121、139篇都係溫書必識。","咒詛詩唔係教你鬧人，而係教你將仇恨交俾神，唔好自己報仇。","好多詩篇直接預言彌賽亞：詩 2、22、110篇，讀嗰陣要留意。"]},{name:"箴言",short:"箴",cat:"詩歌智慧書",author:"所羅門為主，另有亞古珥、利慕伊勒等",period:"約公元前970—700年整理",theme:"智慧唔係識得多，而係識得喺日常生活中敬畏神、做啱決定。",people:"所羅門、智慧人、愚昧人",verseRef:"箴言 3:5",verse:"你要專心仰賴耶和華，不可倚靠自己的聰明。",points:["箴言好多係「原則」，唔係「應許公式」：唔好攞嚟當保證書。","智慧用女人嘅形象出現：佢喺街頭大聲叫人返嚟，愚昧都一樣。","講錢、講說話、講朋友、講婚姻、講做工——智慧係生活化嘅。","才德婦人（31章）唔係「完美女人標準」，而係智慧活出嚟嘅樣。"]},{name:"傳道書",short:"傳",cat:"詩歌智慧書",author:"傳統認為所羅門（傳道者）",period:"約公元前940年左右",theme:"日光之下，乜嘢都係虛空；唯有敬畏神，先有真正意義。",people:"傳道者（所羅門）",verseRef:"傳道書 12:13",verse:"敬畏神，謹守他的誡命，這是人所當盡的本分。",points:["「虛空」唔係話乜都冇用，而係話「留唔住、捉唔實」。","試過晒：智慧、錢、享受、工作、名聲，全部都唔夠填滿人心。","唔好誤會成灰心書：佢叫你珍惜眼前嘅日子、食飯、做工、愛身邊人。","結尾係全卷鎖匙：唔好喺日光之下搵答案，要抬頭望返神。"]},{name:"雅歌",short:"歌",cat:"詩歌智慧書",author:"所羅門",period:"約公元前970—930年",theme:"用愛情詩講一個好大嘅真理：神對佢子民嘅愛係熱烈、專一、委身嘅。",people:"良人、書拉密女、耶路撒冷眾女子",verseRef:"雅歌 8:7",verse:"愛情，眾水不能熄滅，大水也不能淹沒。",points:["字面係男女愛情詩：欣賞、渴慕、委身，愛情本身係神創造嘅好事。","猶太傳統同教會都用佢嚟講神同百姓、基督同教會嘅愛。","唔好只睇到「肉麻」就跳過：專一嘅愛、唔佔有嘅愛，先係重點。","溫書要記：雅歌唔係寓言密碼書，唔好逐句夾硬解成第二樣嘢。"]},{name:"以賽亞書",short:"賽",cat:"大先知書",author:"以賽亞",period:"約公元前740—680年，南國猶大",theme:"聖潔嘅神要審判，但審判之後，佢要親自嚟拯救。",people:"以賽亞、烏西雅王、亞哈斯王、希西家王",verseRef:"以賽亞書 53:5",verse:"因他受的刑罰，我們得平安；因他受的鞭傷，我們得醫治。",points:["開頭講審判，中間講列國，後段講安慰：結構記「審判 → 安慰」。","賽 6章：以賽亞見到聖潔嘅神，先認罪，先至聽到差遣。","彌賽亞預言最多：童女懷孕（7:14）、和平之君（9:6）、受苦僕人（53章）。","新約引用以賽亞書最多，溫舊約一定要識呢卷。"]},{name:"耶利米書",short:"耶",cat:"大先知書",author:"耶利米、文士巴錄記錄",period:"約公元前627—586年，猶大亡國前後",theme:"流淚先知：講咗40年冇人聽，但神嘅話一句都唔會落空。",people:"耶利米、巴錄、西底家王、約雅敬王",verseRef:"耶利米書 31:33",verse:"我要將我的律法放在他們裡面，寫在他們心上。",points:["耶利米由細就被呼召：「我未將你造在腹中，我已曉得你。」","佢用行動講道：腰帶、陶器、軛，全部都係活教材。","新約好重要：神應許立「新約」，唔係寫喺石版，而係寫喺心入面。","佢俾人打、俾人掟入井、俾人笑，但佢話神嘅話喺心入面「如同燒著嘅火」。"]},{name:"耶利米哀歌",short:"哀",cat:"大先知書",author:"傳統認為耶利米",period:"約公元前586年，耶路撒冷陷落之後",theme:"城破了、聖殿冇了，但喺廢墟入面仍然可以話：神嘅慈愛未斷絕。",people:"耶利米、耶路撒冷百姓",verseRef:"耶利米哀歌 3:22-23",verse:"我們不致消滅，是出於耶和華諸般的慈愛；每早晨，這都是新的。",points:["五首哀歌，前四首係離合詩：用希伯來字母順序寫，代表哀傷有頭有尾、有秩序。","唔係「正能量」書：佢容許你為城市、為教會、為自己嘅破碎而喊。","第3章係轉捩點：喺最黑嗰陣，仍然記得神嘅信實。","哀歌同耶利米書要一齊讀：一個講審判來臨，一個講審判之後點樣行落去。"]},{name:"以西結書",short:"結",cat:"大先知書",author:"以西結",period:"約公元前593—571年，被擄到巴比倫期間",theme:"神嘅榮耀離開聖殿，但神冇離開佢嘅百姓。",people:"以西結、被擄百姓",verseRef:"以西結書 36:26",verse:"我也要賜給你們一個新心，將新靈放在你們裡面。",points:["異象好震撼：四活物、枯骨復活、聖殿水流出嚟，全部都係「神仲喺度」嘅記號。","枯骨谷：以色列好似已經死晒，但神嘅靈一吹，就可以再企起身。","以西結做「啞口先知」、瞓喺度、食餅，都係用身體嚟講道。","結尾新聖殿異象：重點唔係建築圖，而係「耶和華的所在」——神要住喺人中間。"]},{name:"但以理書",short:"但",cat:"大先知書",author:"但以理",period:"約公元前605—536年，巴比倫及波斯朝",theme:"喺異教帝國做官，仍然可以唔妥協；地上列國會過去，神嘅國永遠長存。",people:"但以理、沙得拉、米煞、亞伯尼歌、尼布甲尼撒王",verseRef:"但以理書 2:44",verse:"天上的神必另立一國，永不敗壞。",points:["前半部係故事：獅子坑、火窯、牆上寫字，講忠心同神嘅掌權。","後半部係異象：四獸、七十個七，講歷史同末後嘅國度。","但以理每日三次開窗禱告：喺壓力底下，習慣先係最真實嘅信仰。","「人子」呢個稱呼由呢度嚟，耶穌成日用嚟講自己。"]},{name:"何西阿書",short:"何",cat:"小先知書",author:"何西阿",period:"約公元前755—715年，北國以色列末期",theme:"神用先知嘅婚姻嚟講：就算你變心，神嘅愛都唔會放手。",people:"何西阿、歌篾、以色列百姓",verseRef:"何西阿書 11:8",verse:"我怎能捨棄你？",points:["何西阿娶咗會離開佢嘅歌篾，仲要再去將佢贖返嚟，成件事就係福音嘅圖畫。","以色列拜巴力，好似喺婚姻入面出軌，神話呢個叫「淫亂」。","審判好嚴厲，但每一章審判後面都跟住一句「我必醫治」。","記住呢卷嘅心：神唔係「你做好先愛你」，而係「你走咗，佢仲去搵你」。"]},{name:"約珥書",short:"珥",cat:"小先知書",author:"約珥",period:"約公元前835年或被擄後，時間有爭議",theme:"蝗蟲災 = 耶和華的日子近了，呼籲全民撕裂心腸回轉。",people:"約珥、猶大百姓、祭司",verseRef:"約珥書 2:28",verse:"我要將我的靈澆灌凡有血氣的。",points:["蝗蟲食晒一切：先知話，呢個災唔係天氣問題，而係屬靈警鐘。","「撕裂心腸，唔係撕裂衣服」：神要嘅係真回轉，唔係做樣。","聖靈澆灌嘅預言喺五旬節應驗（使徒行傳 2章），舊約同新約喺呢度接通。","最後有應許：神要補還蝗蟲食咗嘅年日，失去嘅時間神都可以追返。"]},{name:"阿摩司書",short:"摩",cat:"小先知書",author:"阿摩司（牧人出身）",period:"約公元前760—750年，北國以色列繁榮期",theme:"唔好用敬拜掩飾不公義：神要公平如大水滾滾。",people:"阿摩司、耶羅波安二世、亞瑪謝祭司",verseRef:"阿摩司書 5:24",verse:"惟願公平如大水滾滾，使公義如江河滔滔。",points:["阿摩司唔係專業先知，佢係牧羊人，神叫佢去，佢就去。","先審判列國，再審判猶大同以色列：神對所有人都係公義嘅。","北國當時好有錢，但窮人俾人踩，敬拜越熱鬧，神越嬲。","五個異象：蝗蟲、火、準繩、夏果、聖殿，講審判一步步嚟緊。"]},{name:"俄巴底亞書",short:"俄",cat:"小先知書",author:"俄巴底亞",period:"約公元前586年之後，以東趁火打劫之後",theme:"最短嘅一卷：驕傲嘅以東會跌低，神嘅國終必得勝。",people:"俄巴底亞、以東人、猶大人",verseRef:"俄巴底亞書 1:15",verse:"耶和華降罰的日子臨近萬國。",points:["成卷得21節，係舊約最短，考試成日問。","以東係以掃後代，係以色列嘅兄弟民族，但喺猶大有難嗰陣落井下石。","「你兄弟遭難，你唔好幸災樂禍」：呢句今日都啱用。","結尾：國度必歸耶和華，唔係歸邊個民族或者帝國。"]},{name:"約拿書",short:"拿",cat:"小先知書",author:"傳統認為約拿",period:"約公元前780—750年，亞述帝國時期",theme:"神愛仇敵，連尼尼微人都肯救；問題係，你肯唔肯？",people:"約拿、尼尼微人、船上水手、大魚",verseRef:"約拿書 4:2",verse:"你是有恩典、有憐憫的神。",points:["約拿唔係驚先逃走，佢係唔想敵人得救，佢想睇住仇敵俾神滅咗。","大魚唔係重點，重點係神俾第二次機會：俾約拿，俾尼尼微。","全城由王到百姓都悔改，連牲畜都披麻，係聖經入面最大規模嘅回轉。","結尾神問約拿：「你發怒合乎理嗎？」——成卷書停喺一個問題，要你自己答。"]},{name:"彌迦書",short:"彌",cat:"小先知書",author:"彌迦",period:"約公元前735—700年，南國猶大",theme:"神要嘅唔係多多祭物，而係行公義、好憐憫、存謙卑嘅心。",people:"彌迦、猶大同以色列領袖",verseRef:"彌迦書 6:8",verse:"行公義，好憐憫，存謙卑的心，與你的神同行。",points:["彌迦講嘢好直接：領袖貪錢、祭司為利、先知收錢先講預言。","伯利恆預言（5:2）：彌賽亞要喺細到唔起眼嘅小城出世。","審判之後有盼望：餘民會返嚟，神會親自牧養。","6:8係全卷最要背嘅一句：信仰唔係儀式，而係生活態度。"]},{name:"那鴻書",short:"鴻",cat:"小先知書",author:"那鴻",period:"約公元前663—612年，尼尼微亡國之前",theme:"約拿嗰陣尼尼微悔改過，但佢哋又返轉頭，今次審判真係嚟了。",people:"那鴻、尼尼微人、猶大人",verseRef:"那鴻書 1:7",verse:"耶和華本為善，在患難的日子為人的保障。",points:["要同約拿書一齊讀：約拿講憐憫，那鴻講公義，兩個都係真嘅。","尼尼微係當時最殘暴嘅帝國，神忍耐咗成100年，最後都係要審判。","對猶大嚟講係好消息：壓迫你哋嘅帝國唔會永遠喺度。","神唔係即刻發嬲，佢係「不輕易發怒」，但唔代表佢唔會發怒。"]},{name:"哈巴谷書",short:"哈",cat:"小先知書",author:"哈巴谷",period:"約公元前605年左右，巴比倫興起之時",theme:"先知問神「點解」，神冇即刻解釋，但俾咗一個可以行落去嘅答案。",people:"哈巴谷、迦勒底人（巴比倫）",verseRef:"哈巴谷書 3:19",verse:"主耶和華是我的力量。",points:["成卷書係先知同神嘅對話，唔係先知對百姓講道，結構好特別。","哈巴谷問：「惡人點解咁猖狂？」神答：「我會用更惡嘅巴比倫嚟審判。」","「義人必因信得生」（2:4）係全本聖經最重要嘅句子之一，新約引用咗三次。","結尾冇晒嘢都仲可以歡喜：無花果樹唔發旺，都仲可以因神歡欣。"]},{name:"西番雅書",short:"番",cat:"小先知書",author:"西番雅（希西家王後裔）",period:"約公元前640—609年，約西亞改革之前",theme:"耶和華的日子近了：審判好可怕，但餘民會得著拯救同喜樂。",people:"西番雅、約西亞王、猶大百姓",verseRef:"西番雅書 3:17",verse:"耶和華你的神在你中間必因你歡欣喜樂。",points:["西番雅係王室後人，但佢冇幫王室講好說話，講嘅係審判。","「耶和華的日子」喺呢卷出現得最密：審判唔係得個講字。","審判完唔係得返個空殼：神會留下謙卑、尋求神嘅餘民。","3:17係成部舊約最溫柔嘅圖畫之一：神因你歡欣，仲為你歌唱。"]},{name:"哈該書",short:"該",cat:"小先知書",author:"哈該",period:"約公元前520年，歸回重建聖殿受阻時",theme:"你哋住緊裝修靚靚嘅屋，神嘅殿就荒涼？次序錯晒啦。",people:"哈該、所羅巴伯、約書亞大祭司",verseRef:"哈該書 1:8",verse:"你們要上山取木料，建造這殿。",points:["成卷得2章，時間只係4個月，係最「趕」嘅先知書。","百姓話「時候未到」，其實係自己唔想做，哈該一針見血指出嚟。","「你們撒的種多，收的卻少」：唔係神唔祝福，而係次序擺錯咗。","神嘅回應好溫暖：「我與你們同在」，唔係鬧完就算。"]},{name:"撒迦利亞書",short:"亞",cat:"小先知書",author:"撒迦利亞",period:"約公元前520—480年，同哈該同期開始",theme:"鼓勵歸回百姓：唔好睇小呢日，神嘅計劃大到超乎想像。",people:"撒迦利亞、所羅巴伯、約書亞大祭司",verseRef:"撒迦利亞書 4:6",verse:"不是倚靠勢力，不是倚靠才能，乃是倚靠我的靈方能成事。",points:["八個異象 + 兩段神諭，異象多到眼花，要逐個睇：馬、角、量度線、金燈台……","金燈台異象就係講：做唔到唔係因為你冇力，而係要靠聖靈。","彌賽亞預言好多：騎驢入京（9:9）、被賣三十塊錢（11:12）、被扎（12:10）。","同哈該要一齊記：一個講「快啲起」，一個講「起完之後會點」。"]},{name:"瑪拉基書",short:"瑪",cat:"小先知書",author:"瑪拉基",period:"約公元前430—400年，舊約最後一卷",theme:"神話「我愛你哋」，百姓話「你邊度愛我哋？」——舊約停喺一個對話入面。",people:"瑪拉基、歸回後嘅百姓、祭司",verseRef:"瑪拉基書 3:10",verse:"你們要將當納的十分之一全然送入倉庫。",points:["成卷係神同百姓「駁嘴」：神講一句，百姓頂一句，來回六次。","問題好實際：獻次等祭物、娶外邦女子、奉獻縮水、婚姻唔忠心。","預言以利亞要先嚟：施洗約翰就係應驗，舊約同新約喺呢度駁埋。","舊約最後一句唔係祝福，而係警告，然後沉默400年——等緊嗰位要嚟嘅。"]}],zu=[{t:"創造",d:"神創造天地、人按神形象被造，起初一切都係好。",ref:"創 1—2章"},{t:"亞伯拉罕",d:"神呼召亞伯拉罕，立約：後裔、土地、萬國得福。",ref:"創 12章"},{t:"出埃及",d:"摩西帶以色列人離開埃及，過紅海，西乃山立約。",ref:"出 1—20章"},{t:"曠野",d:"漂流40年，舊一代倒斃，新一代學識信靠。",ref:"民數記"},{t:"進迦南",d:"約書亞帶百姓過約旦河，分地定居。",ref:"書 1—24章"},{t:"士師",d:
